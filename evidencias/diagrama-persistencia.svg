<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">Comparación entre PostgreSQL sin volumen reutilizable y con volumen nombrado</title>
  <desc id="desc">En la primera prueba los datos desaparecen al recrear el contenedor; en la segunda, pgdata conserva los datos para el contenedor recreado.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .heading{font:700 20px Arial,sans-serif;fill:#0f172a}.label{font:600 15px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#334155}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.db{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.lost{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="800" height="410" fill="#ffffff"/>
  <text x="200" y="35" text-anchor="middle" class="heading">Parte 1: sin volumen reutilizable</text>
  <rect x="55" y="70" width="290" height="85" rx="10" class="box"/>
  <text x="200" y="105" text-anchor="middle" class="label">server_db1</text>
  <text x="200" y="130" text-anchor="middle" class="small">PostgreSQL 17 + base test</text>
  <line x1="200" y1="155" x2="200" y2="218" class="line"/>
  <rect x="55" y="230" width="290" height="75" rx="10" class="lost"/>
  <text x="200" y="260" text-anchor="middle" class="label">Contenedor eliminado</text>
  <text x="200" y="284" text-anchor="middle" class="small">almacenamiento anterior no reutilizado</text>
  <line x1="200" y1="305" x2="200" y2="352" class="line"/>
  <text x="200" y="383" text-anchor="middle" class="label" fill="#dc2626">test no aparece al recrear</text>
  <text x="600" y="35" text-anchor="middle" class="heading">Parte 2: volumen persistente</text>
  <rect x="455" y="70" width="290" height="85" rx="10" class="box"/>
  <text x="600" y="105" text-anchor="middle" class="label">server_db2</text>
  <text x="600" y="130" text-anchor="middle" class="small">PostgreSQL 17 + base test</text>
  <line x1="600" y1="155" x2="600" y2="218" class="line"/>
  <rect x="455" y="230" width="290" height="75" rx="10" class="db"/>
  <text x="600" y="260" text-anchor="middle" class="label">Volumen nombrado pgdata</text>
  <text x="600" y="284" text-anchor="middle" class="small">ciclo de vida independiente</text>
  <line x1="600" y1="305" x2="600" y2="352" class="line"/>
  <text x="600" y="383" text-anchor="middle" class="label" fill="#16a34a">test y registros se recuperan</text>
</svg>

